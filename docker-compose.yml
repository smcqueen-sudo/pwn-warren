# Pwn-Warren - one scoreboard (infrastructure) + N burrows (targets).
# All ports bind 0.0.0.0 so the whole LAN can reach them. THIS IS DELIBERATE -
# run only on a trusted LAN or VPN, never on a public IP.
#
# Adding a burrow = copy a burrow block, bump the host port to 800N, and
# point it at the new burrow directory + its .flag.env.

services:
  scoreboard:
    build: ./scoreboard
    ports:
      - "0.0.0.0:8000:5000"
    environment:
      # Scorekeeper password; required. Set it in your shell before `up`.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD before docker compose up}"
      # Optional: a fixed session key so logins survive restarts.
      SECRET_KEY: "${SECRET_KEY:-}"
    volumes:
      - scoreboard-data:/data
      # Full challenge registry (every flag) - mounted read-only, scoreboard only.
      - ./scoreboard/seed:/seed:ro
    restart: unless-stopped

  library:
    build: ./burrows/library
    ports:
      - "0.0.0.0:8001:5000"
    # Supplies FLAG - this burrow's own flag only (never the full registry).
    env_file:
      - ./burrows/library/.flag.env
    restart: unless-stopped

  lounge:
    build: ./burrows/lounge
    ports:
      - "0.0.0.0:8002:5000"
    env_file:
      - ./burrows/lounge/.flag.env
    restart: unless-stopped

  backup:
    build: ./burrows/backup
    ports:
      - "0.0.0.0:8003:5000"
    env_file:
      - ./burrows/backup/.flag.env
    restart: unless-stopped

  dispatch:
    build: ./burrows/dispatch
    ports:
      - "0.0.0.0:8004:5000"
    env_file:
      - ./burrows/dispatch/.flag.env
    restart: unless-stopped

volumes:
  scoreboard-data:
